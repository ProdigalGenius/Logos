name: sahanet

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sahanet
      POSTGRES_USER: sahanet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahanet_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahanet -d sahanet"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Api/SahaNet.Api/Dockerfile
    profiles: ["api"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: Host=postgres;Port=5432;Database=sahanet;Username=sahanet;Password=${POSTGRES_PASSWORD:-sahanet_dev}
      Redis__ConnectionString: redis:6379
    ports:
      - "5080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
